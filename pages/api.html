<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nbitq API reference</title>
  <meta name="description" content="Every nbitq function: indexed and cursor get/put, varints, bit runs, the reader and writer structs, and the optional .nbq container.">
  <meta name="author" content="M. A. Chatterjee (github.com/deftio)">
  <script src="https://cdn.jsdelivr.net/npm/bitwrench@2.1.11/dist/bitwrench.umd.min.js"></script>
  <script src="site.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    var S = nbitqSite;

    function fn(sig, note) { return { sig: S.c(sig), note: note }; }
    var FN = [{ key: 'sig', label: 'Function' }, { key: 'note', label: 'Notes' }];

    S.page('api.html', {
      title: 'API reference',
      subtitle: 'Everything is in nbitq.h unless marked container, which is nbitq_container.h. All functions are extern "C".',
      content: [

        S.section('Conventions', [
          S.table([{ key: 'name', label: 'Parameter' }, { key: 'meaning', label: 'Meaning' }], [
            { name: S.c('buf'), meaning: 'byte buffer; bit 0 is the MSB of buf[0]' },
            { name: S.c('bit_len'), meaning: 'number of valid bits in a buffer being read' },
            { name: S.c('bit_cap'), meaning: 'capacity in bits of a buffer being written' },
            { name: S.c('bit_pos'), meaning: 'position of the first bit of the field' },
            { name: S.c('n'), meaning: 'field width in bits' },
            { name: S.c('base'), meaning: 'varint group width in bits, 2..64' }
          ])
        ], 'conventions'),

        S.section('Results', [
          S.code([
            'typedef enum {',
            '    NBQ_OK            =  0,',
            '    NBQ_ERR_PARAM     = -1,   /* null pointer, or a width/base out of range     */',
            '    NBQ_ERR_RANGE     = -2,   /* the operation would cross the end of the buffer */',
            '    NBQ_ERR_OVERFLOW  = -3,   /* value does not fit the destination type         */',
            '    NBQ_ERR_MALFORMED = -4,   /* varint overlong, or an impossible encoding      */',
            '    NBQ_ERR_ALLOC     = -5    /* only from nbq_writer_init_alloc / grow          */',
            '} nbq_result;',
            '',
            'const char *nbq_strerror(nbq_result rc);'
          ]),
          S.p('Every function that can fail returns an nbq_result. On any failure nothing is written and no cursor moves.')
        ], 'results'),

        S.section('Constants and macros', [
          S.code([
            '#define NBQ_VERSION_STRING   "0.1.0"   /* and NBQ_VERSION_MAJOR / MINOR / PATCH */',
            '#define NBQ_VERSION          /* (MAJOR << 16) | (MINOR << 8) | PATCH */',
            '',
            'const char *nbq_version_string(void);  /* the linked library\'s NBQ_VERSION_STRING */',
            'uint32_t    nbq_version(void);         /* the linked library\'s NBQ_VERSION */',
            '#define NBQ_MAX_WIDTH        64u       /* widest field a single call moves */',
            '#define NBQ_VARINT_MIN_BASE  2u',
            '#define NBQ_VARINT_MAX_BASE  64u',
            '#define NBQ_BYTES_FOR_BITS(bits)       /* bytes needed to hold `bits` bits */'
          ]),
          S.p(['Define ', S.c('NBQ_NO_MALLOC'), ' before compiling ', S.c('nbitq.c'), ' to remove ', S.c('nbq_writer_init_alloc'), ' and every hosted ', S.c('#include'), '.'])
        ], 'constants'),

        S.section('Indexed API', [
          S.p(['No state, no allocation. Each call is bounds-checked against ', S.c('bit_len'), ' or ', S.c('bit_cap'), '.']),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Fixed-width integers' },
          S.code([
            'nbq_result nbq_get_u64(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, uint64_t *out);',
            'nbq_result nbq_get_s64(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, int64_t  *out);',
            'nbq_result nbq_get_u32(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, uint32_t *out);',
            'nbq_result nbq_get_s32(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, int32_t  *out);',
            '',
            'nbq_result nbq_put_u64(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, uint64_t value);',
            'nbq_result nbq_put_s64(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, int64_t  value);',
            'nbq_result nbq_put_u32(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, uint32_t value);',
            'nbq_result nbq_put_s32(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, int32_t  value);'
          ]),
          S.ul([
            [S.c('n'), ' is 1..64 for the 64-bit functions and 1..32 for the 32-bit ones; anything else is ', S.c('NBQ_ERR_PARAM'), '.'],
            ['The signed get functions sign-extend from bit ', S.c('n-1'), '. The signed put functions write the low ', S.c('n'), ' bits of the value.'],
            ['put leaves bits outside the field untouched.'],
            ['The u32/s32 functions use no 64-bit arithmetic. They are a separate path that produces identical bits, for targets without a native 64-bit type.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: '64-bit values as two halves' },
          S.code([
            'typedef struct { uint32_t hi; uint32_t lo; } nbq_u64_parts;',
            '',
            'nbq_result nbq_get_parts(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, nbq_u64_parts *out);',
            'nbq_result nbq_put_parts(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, nbq_u64_parts value);'
          ]),
          S.p([S.c('n'), ' is 1..64. Same bits as ', S.c('nbq_get_u64'), ' / ', S.c('nbq_put_u64'), ', using only 32-bit arithmetic.']),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Varints' },
          S.code([
            'nbq_result nbq_get_varint  (const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned base, uint64_t *out, uint64_t *next_pos);',
            'nbq_result nbq_get_varint_s(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned base, int64_t  *out, uint64_t *next_pos);',
            'nbq_result nbq_put_varint  (uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned base, uint64_t value, uint64_t *next_pos);',
            'nbq_result nbq_put_varint_s(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned base, int64_t  value, uint64_t *next_pos);',
            '',
            'unsigned nbq_varint_bits  (uint64_t value, unsigned base);',
            'unsigned nbq_varint_bits_s(int64_t  value, unsigned base);'
          ]),
          S.ul([
            ['A group is ', S.c('base'), ' bits: ', S.c('base − 1'), ' payload bits and one continuation bit. Base 8 is LEB128 exactly.'],
            [S.c('next_pos'), ', if non-NULL, receives the position just past the varint. A varint’s width is not known until it is read, so an indexed caller needs this to advance.'],
            ['Overlong encodings and values wider than 64 bits are ', S.c('NBQ_ERR_MALFORMED'), '.'],
            ['The _s variants apply zigzag: 0, −1, 1, −2, 2, … map to 0, 1, 2, 3, 4, …'],
            [S.c('nbq_varint_bits'), ' returns the encoded width without writing, or 0 if ', S.c('base'), ' is invalid.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Bit runs' },
          S.code([
            'nbq_result nbq_copy_bits    (const uint8_t *src, uint64_t src_bits, uint64_t src_pos,',
            '                             uint8_t *dst, uint64_t dst_bits, uint64_t dst_pos, uint64_t n);',
            'nbq_result nbq_fill_bits    (uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, uint64_t n, int value);',
            'nbq_result nbq_compare_bits (const uint8_t *a, uint64_t a_bits, uint64_t a_pos,',
            '                             const uint8_t *b, uint64_t b_bits, uint64_t b_pos, uint64_t n, int *out);',
            'nbq_result nbq_popcount_bits(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, uint64_t n, uint64_t *out);'
          ]),
          S.ul([
            [S.c('n'), ' may be any length, not just up to 64. ', S.c('n == 0'), ' succeeds and does nothing.'],
            [S.c('nbq_copy_bits'), ': src and dst may be the same buffer; overlapping ranges are handled correctly.'],
            [S.c('nbq_fill_bits'), ': value is 0 or nonzero.'],
            [S.c('nbq_compare_bits'), ': *out is <0, 0 or >0 like memcmp, comparing most-significant bit first.']
          ])
        ], 'indexed'),

        S.section('Cursor API', [
          S.p('Thin wrappers over the indexed API. The structs are public; place them wherever you like.'),
          S.code([
            'typedef struct {',
            '    const uint8_t *buf;',
            '    uint64_t bits;      /* valid bits in buf  */',
            '    uint64_t pos;       /* next bit to read   */',
            '} nbq_reader;',
            '',
            'typedef struct {',
            '    uint8_t *buf;',
            '    uint64_t cap;       /* capacity in bits   */',
            '    uint64_t pos;       /* next bit to write  */',
            '    int owns_buf;       /* nonzero if nbq_writer_init_alloc allocated buf */',
            '} nbq_writer;'
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Setup' },
          S.table(FN, [
            fn('nbq_reader_init(r, buf, bit_len)', 'Allocates nothing; buf may be in ROM.'),
            fn('nbq_writer_init(w, buf, bit_cap)', 'Allocates nothing, never grows; a write past bit_cap is NBQ_ERR_RANGE.'),
            fn('nbq_writer_init_alloc(w, initial_bits)', 'Owns a heap buffer and doubles it as needed. The only allocating function. Absent under NBQ_NO_MALLOC.'),
            fn('nbq_writer_free(w)', 'Releases a buffer that init_alloc allocated; a no-op otherwise.')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Position' },
          S.table(FN, [
            fn('nbq_reader_remaining(r)', 'Bits not yet read.'),
            fn('nbq_reader_seek(r, bit_pos)', 'Refuses a position past the end.'),
            fn('nbq_writer_seek(w, bit_pos)', 'A fixed writer refuses a position past its capacity; a growing writer grows.'),
            fn('nbq_reader_align(r, n)', 'Advance to the next multiple of n bits; the skipped bits must be zero or it is NBQ_ERR_MALFORMED.'),
            fn('nbq_writer_align(w, n)', 'Advance to the next multiple of n bits, writing zeros. n of 8 is byte alignment.')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Sequential reads and writes' },
          S.p(['Each read is the indexed call at ', S.c('r->pos'), ', then advance on success. A growing writer enlarges its buffer when a write would pass ', S.c('cap'), '; a fixed writer returns ', S.c('NBQ_ERR_RANGE'), '.']),
          S.code([
            'nbq_result nbq_read_u64     (nbq_reader *r, unsigned n, uint64_t *out);',
            'nbq_result nbq_read_s64     (nbq_reader *r, unsigned n, int64_t *out);',
            'nbq_result nbq_read_u32     (nbq_reader *r, unsigned n, uint32_t *out);',
            'nbq_result nbq_read_s32     (nbq_reader *r, unsigned n, int32_t *out);',
            'nbq_result nbq_read_parts   (nbq_reader *r, unsigned n, nbq_u64_parts *out);',
            'nbq_result nbq_read_varint  (nbq_reader *r, unsigned base, uint64_t *out);',
            'nbq_result nbq_read_varint_s(nbq_reader *r, unsigned base, int64_t *out);',
            'nbq_result nbq_read_bits    (nbq_reader *r, uint8_t *dst, uint64_t dst_bits, uint64_t dst_pos, uint64_t n);',
            '',
            'nbq_result nbq_write_u64     (nbq_writer *w, unsigned n, uint64_t value);',
            'nbq_result nbq_write_s64     (nbq_writer *w, unsigned n, int64_t value);',
            'nbq_result nbq_write_u32     (nbq_writer *w, unsigned n, uint32_t value);',
            'nbq_result nbq_write_s32     (nbq_writer *w, unsigned n, int32_t value);',
            'nbq_result nbq_write_parts   (nbq_writer *w, unsigned n, nbq_u64_parts value);',
            'nbq_result nbq_write_varint  (nbq_writer *w, unsigned base, uint64_t value);',
            'nbq_result nbq_write_varint_s(nbq_writer *w, unsigned base, int64_t value);',
            'nbq_result nbq_write_bits    (nbq_writer *w, const uint8_t *src, uint64_t src_bits, uint64_t src_pos, uint64_t n);'
          ])
        ], 'cursor'),

        S.section('Container', [
          S.p([S.c('#include "nbitq_container.h"'), ', compile ', S.c('nbitq_container.c'), '. Optional and separate on purpose.']),
          S.code([
            '#define NBQ_CONTAINER_VERSION 1',
            '#define NBQ_FILE_EXTENSION    ".nbq"',
            '#define NBQ_TYPE_MAX          255u     /* longest type string accepted */',
            '',
            'typedef struct {',
            '    const char    *type;          /* NOT NUL-terminated */',
            '    size_t         type_len;',
            '    const uint8_t *payload;',
            '    uint64_t       payload_bits;',
            '    uint8_t        version;',
            '} nbq_container;',
            '',
            'nbq_result nbq_container_size (size_t type_len, uint64_t payload_bits, uint64_t *out_bytes);',
            'nbq_result nbq_container_write(uint8_t *out, size_t out_cap, const char *type, size_t type_len,',
            '                               const uint8_t *payload, uint64_t payload_bits, size_t *out_len);',
            'nbq_result nbq_container_read (const uint8_t *buf, size_t len, nbq_container *out);',
            'nbq_result nbq_container_read_unchecked(const uint8_t *buf, size_t len, nbq_container *out);'
          ]),
          S.ul([
            ['Layout: ', S.c('"NBQ\\1"'), ', base-8 varint type_len, type bytes, base-8 varint payload_bits, payload zero-padded to a byte, CRC-64 of everything before it, big-endian.'],
            [S.c('nbq_container_read'), ' verifies magic, version, every length, the absence of trailing bytes, and the CRC. On success out aliases buf, which must outlive it; nothing is copied.'],
            [S.c('nbq_container_read_unchecked'), ' skips only the CRC. Every bounds check still runs.'],
            ['type_len may be 0. Longer than ', S.c('NBQ_TYPE_MAX'), ' is ', S.c('NBQ_ERR_PARAM'), '.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'CRC-64/XZ' },
          S.code([
            '#define NBQ_CRC64_INIT UINT64_MAX',
            'uint64_t nbq_crc64       (const uint8_t *data, size_t len);',
            'uint64_t nbq_crc64_update(uint64_t crc, const uint8_t *data, size_t len);',
            'uint64_t nbq_crc64_final (uint64_t crc);'
          ]),
          S.p(['ECMA-182 polynomial, reflected, init and final XOR all ones. Verified against ', S.c('CRC-64/XZ("123456789") == 0x995DC9BBDF1939FA'), '. Bitwise, no table.'])
        ], 'container'),

        bw.makeCTA({
          title: 'The headers are the reference of record',
          description: 'nbitq.h and nbitq_container.h carry the same documentation as comments, next to the declarations.',
          actions: [
            S.linkButton('nbitq.h on GitHub', S.REPO + '/blob/main/nbitq.h'),
            S.linkButton('nbitq_container.h', S.REPO + '/blob/main/nbitq_container.h', 'outline-primary')
          ]
        })
      ]
    });
  </script>
</body>
</html>
