<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nbitq API reference</title>
  <meta name="description" content="Every nbitq function: indexed and cursor get/put, varints, bit runs, the reader and writer structs, and the optional .nbq container.">
  <meta name="author" content="M. A. Chatterjee (github.com/deftio)">
  <script src="https://cdn.jsdelivr.net/npm/bitwrench@2.1.11/dist/bitwrench.umd.min.js"></script>
  <script src="site.js"></script>
  <script data-goatcounter="https://deftio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    var S = nbitqSite;

    function fn(sig, note) { return { sig: S.c(sig), note: note }; }
    var FN = [{ key: 'sig', label: 'Function' }, { key: 'note', label: 'Notes' }];
    function row(name, does) { return { fn: S.c(name), does: does }; }
    var DOES = [{ key: 'fn', label: 'Function' }, { key: 'does', label: 'Does' }];

    S.page('api.html', {
      title: 'API reference',
      subtitle: 'Everything is in nbitq.h unless marked container, which is nbitq_container.h. All functions are extern "C".',
      content: [

        S.section('Overview', [
          S.p('Every function, by group. The sections below give signatures and the details.'),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Version and errors' },
          S.table(DOES, [
            row('nbq_version_string() / nbq_version()', 'Version of the library that was linked, as a string and as (major << 16) | (minor << 8) | patch'),
            row('nbq_strerror(rc)', 'Text for a result code')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Indexed fixed-width integers (buffer, length, position; no state)' },
          S.table(DOES, [
            row('nbq_get_u64 / nbq_get_u32', 'Read n bits at bit_pos as an unsigned integer, MSB first'),
            row('nbq_get_s64 / nbq_get_s32', 'The same, sign-extended from bit n−1'),
            row('nbq_put_u64 / nbq_put_u32', 'Write the low n bits of a value at bit_pos; bits outside the field are untouched'),
            row('nbq_put_s64 / nbq_put_s32', 'The same for a signed value (two’s complement in n bits)'),
            row('nbq_get_parts / nbq_put_parts', 'Up to 64 bits as a {hi, lo} pair of 32-bit halves, using no 64-bit arithmetic'),
            row('nbq_get_f32 / nbq_put_f32 / nbq_get_f64 / nbq_put_f64', 'A float or double as its IEEE-754 bit pattern in a 32- or 64-bit field; header-only, no floating-point arithmetic')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Indexed varints' },
          S.table(DOES, [
            row('nbq_get_varint / nbq_put_varint', 'Decode or encode an unsigned varint with base-bit groups; next_pos receives the end'),
            row('nbq_get_varint_s / nbq_put_varint_s', 'The same with zigzag for signed values'),
            row('nbq_varint_bits / nbq_varint_bits_s', 'Encoded width of a value at a base, without writing')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Bit runs (any length)' },
          S.table(DOES, [
            row('nbq_copy_bits', 'Move n bits from one offset to another, in the same or another buffer; overlap-safe'),
            row('nbq_fill_bits', 'Set n bits to 0 or 1'),
            row('nbq_compare_bits', 'Compare two runs, MSB first, like memcmp'),
            row('nbq_popcount_bits', 'Count the 1 bits in a run')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Cursor (a reader or writer struct holding a position)' },
          S.table(DOES, [
            row('nbq_reader_init / nbq_writer_init', 'Point a cursor at caller-owned storage; allocates nothing'),
            row('nbq_writer_init_alloc / nbq_writer_free', 'A writer over a heap buffer that doubles as needed; the only allocation in the library'),
            row('nbq_reader_remaining', 'Bits not yet read'),
            row('nbq_reader_seek / nbq_writer_seek', 'Move the position; a fixed writer refuses a position past its capacity'),
            row('nbq_reader_align / nbq_writer_align', 'Advance to the next multiple of n bits; the writer writes zeros, the reader requires zeros'),
            row('nbq_read_u64 _s64 _u32 _s32 _parts _varint _varint_s', 'The indexed get at the cursor position, then advance'),
            row('nbq_write_u64 _s64 _u32 _s32 _parts _varint _varint_s', 'The indexed put at the cursor position, then advance'),
            row('nbq_read_bits / nbq_write_bits', 'nbq_copy_bits to or from the cursor position, then advance'),
            row('nbq_read_f32 _f64 / nbq_write_f32 _f64', 'The float forms at the cursor position, then advance')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Container (nbitq_container.h, optional)' },
          S.table(DOES, [
            row('nbq_container_size', 'Bytes a container of a given type length and payload length occupies'),
            row('nbq_container_write', 'Write magic, type, length, payload and CRC-64 into a buffer'),
            row('nbq_container_read', 'Parse and verify a container; the result aliases the input'),
            row('nbq_container_read_unchecked', 'The same without the CRC check'),
            row('nbq_crc64 / nbq_crc64_update / nbq_crc64_final', 'CRC-64/XZ, one-shot or incremental')
          ]),
          S.p(['Get and put exist in both the indexed and the cursor form. There is no insert; see ', { t: 'a', a: { href: '#not-provided' }, c: 'Not provided' }, ' for the way to do it with what is here.']),
          S.p(['From C++, ', S.c('nbitq.hpp'), ' wraps the cursor groups as ', S.c('nbq::Reader'), ', ', S.c('nbq::Writer'), ' and ', S.c('nbq::OwningWriter'), '; see ', { t: 'a', a: { href: '#cxx' }, c: 'C++ wrapper' }, '.'])
        ], 'overview'),

        S.section('Conventions', [
          S.table([{ key: 'name', label: 'Parameter' }, { key: 'meaning', label: 'Meaning' }], [
            { name: S.c('buf'), meaning: 'byte buffer; bit 0 is the MSB of buf[0]' },
            { name: S.c('bit_len'), meaning: 'number of valid bits in a buffer being read' },
            { name: S.c('bit_cap'), meaning: 'capacity in bits of a buffer being written' },
            { name: S.c('bit_pos'), meaning: 'position of the first bit of the field' },
            { name: S.c('n'), meaning: 'field width in bits' },
            { name: S.c('base'), meaning: 'varint group width in bits, 2..64' }
          ])
        ], 'conventions'),

        S.section('Results', [
          S.code([
            'typedef enum {',
            '    NBQ_OK            =  0,',
            '    NBQ_ERR_PARAM     = -1,   /* null pointer, or a width/base out of range     */',
            '    NBQ_ERR_RANGE     = -2,   /* the operation would cross the end of the buffer */',
            '    NBQ_ERR_OVERFLOW  = -3,   /* value does not fit the destination type         */',
            '    NBQ_ERR_MALFORMED = -4,   /* varint overlong, or an impossible encoding      */',
            '    NBQ_ERR_ALLOC     = -5    /* only from nbq_writer_init_alloc / grow          */',
            '} nbq_result;',
            '',
            'const char *nbq_strerror(nbq_result rc);'
          ]),
          S.p('Every function that can fail returns an nbq_result. On any failure nothing is written and no cursor moves.')
        ], 'results'),

        S.section('Constants and macros', [
          S.code([
            '#define NBQ_VERSION_STRING   "0.1.2"   /* and NBQ_VERSION_MAJOR / MINOR / PATCH */',
            '#define NBQ_VERSION          /* (MAJOR << 16) | (MINOR << 8) | PATCH */',
            '',
            'const char *nbq_version_string(void);  /* the linked library\'s NBQ_VERSION_STRING */',
            'uint32_t    nbq_version(void);         /* the linked library\'s NBQ_VERSION */',
            '#define NBQ_MAX_WIDTH        64u       /* widest field a single call moves */',
            '#define NBQ_VARINT_MIN_BASE  2u',
            '#define NBQ_VARINT_MAX_BASE  64u',
            '#define NBQ_BYTES_FOR_BITS(bits)       /* bytes needed to hold `bits` bits */'
          ]),
          S.p(['Define ', S.c('NBQ_NO_MALLOC'), ' before compiling ', S.c('nbitq.c'), ' to remove ', S.c('nbq_writer_init_alloc'), ' and every hosted ', S.c('#include'), '.'])
        ], 'constants'),

        S.section('Indexed API', [
          S.p(['No state, no allocation. Each call is bounds-checked against ', S.c('bit_len'), ' or ', S.c('bit_cap'), '.']),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Fixed-width integers' },
          S.code([
            'nbq_result nbq_get_u64(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, uint64_t *out);',
            'nbq_result nbq_get_s64(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, int64_t  *out);',
            'nbq_result nbq_get_u32(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, uint32_t *out);',
            'nbq_result nbq_get_s32(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, int32_t  *out);',
            '',
            'nbq_result nbq_put_u64(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, uint64_t value);',
            'nbq_result nbq_put_s64(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, int64_t  value);',
            'nbq_result nbq_put_u32(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, uint32_t value);',
            'nbq_result nbq_put_s32(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, int32_t  value);'
          ]),
          S.ul([
            [S.c('n'), ' is 1..64 for the 64-bit functions and 1..32 for the 32-bit ones; anything else is ', S.c('NBQ_ERR_PARAM'), '.'],
            ['The signed get functions sign-extend from bit ', S.c('n-1'), '. The signed put functions write the low ', S.c('n'), ' bits of the value.'],
            ['put leaves bits outside the field untouched.'],
            ['The u32/s32 functions use no 64-bit arithmetic. They are a separate path that produces identical bits, for targets without a native 64-bit type.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: '64-bit values as two halves' },
          S.code([
            'typedef struct { uint32_t hi; uint32_t lo; } nbq_u64_parts;',
            '',
            'nbq_result nbq_get_parts(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned n, nbq_u64_parts *out);',
            'nbq_result nbq_put_parts(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned n, nbq_u64_parts value);'
          ]),
          S.p([S.c('n'), ' is 1..64. Same bits as ', S.c('nbq_get_u64'), ' / ', S.c('nbq_put_u64'), ', using only 32-bit arithmetic.']),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Floating point' },
          S.code([
            'static inline nbq_result nbq_get_f32(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, float  *out);',
            'static inline nbq_result nbq_put_f32(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, float  value);',
            'static inline nbq_result nbq_get_f64(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, double *out);',
            'static inline nbq_result nbq_put_f64(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, double value);',
            '',
            'static inline uint32_t nbq_f32_bits(float f);          /* the reinterpretation, both ways */',
            'static inline float    nbq_f32_from_bits(uint32_t u);',
            'static inline uint64_t nbq_f64_bits(double d);',
            'static inline double   nbq_f64_from_bits(uint64_t u);'
          ]),
          S.ul([
            ['A ', S.c('float'), ' or ', S.c('double'), ' is stored as its IEEE-754 bit pattern in a 32- or 64-bit field, MSB first. At a byte-aligned position the bytes are big-endian: ', S.c('3.14159f'), ' is ', S.c('40 49 0F D0'), '.'],
            ['A copy, not a conversion. NaN payloads, signalling NaNs, signed zeros and denormals round-trip bit for bit. ', S.c('nbq_put_f32(.., f)'), ' writes exactly what ', S.c('nbq_put_u32(.., 32, nbq_f32_bits(f))'), ' writes.'],
            ['No floating-point arithmetic or runtime is involved, so a core without an FPU pays for a register move. The functions are ', S.c('static inline'), ' in the header; ', S.c('nbitq.c'), ' contains no floating-point code and a program that never calls them links nothing for them.'],
            ['The position need not be byte-aligned. On a 32-bit target, ', S.c('nbq_put_parts'), ' with ', S.c('nbq_f64_bits'), ' split into halves avoids 64-bit arithmetic.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Varints' },
          S.code([
            'nbq_result nbq_get_varint  (const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned base, uint64_t *out, uint64_t *next_pos);',
            'nbq_result nbq_get_varint_s(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, unsigned base, int64_t  *out, uint64_t *next_pos);',
            'nbq_result nbq_put_varint  (uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned base, uint64_t value, uint64_t *next_pos);',
            'nbq_result nbq_put_varint_s(uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, unsigned base, int64_t  value, uint64_t *next_pos);',
            '',
            'unsigned nbq_varint_bits  (uint64_t value, unsigned base);',
            'unsigned nbq_varint_bits_s(int64_t  value, unsigned base);'
          ]),
          S.ul([
            ['A group is ', S.c('base'), ' bits: ', S.c('base − 1'), ' payload bits and one continuation bit. Base 8 is LEB128 exactly.'],
            [S.c('next_pos'), ', if non-NULL, receives the position just past the varint. A varint’s width is not known until it is read, so an indexed caller needs this to advance.'],
            ['Overlong encodings and values wider than 64 bits are ', S.c('NBQ_ERR_MALFORMED'), '.'],
            ['The _s variants apply zigzag: 0, −1, 1, −2, 2, … map to 0, 1, 2, 3, 4, …'],
            [S.c('nbq_varint_bits'), ' returns the encoded width without writing, or 0 if ', S.c('base'), ' is invalid.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Bit runs' },
          S.code([
            'nbq_result nbq_copy_bits    (const uint8_t *src, uint64_t src_bits, uint64_t src_pos,',
            '                             uint8_t *dst, uint64_t dst_bits, uint64_t dst_pos, uint64_t n);',
            'nbq_result nbq_fill_bits    (uint8_t *buf, uint64_t bit_cap, uint64_t bit_pos, uint64_t n, int value);',
            'nbq_result nbq_compare_bits (const uint8_t *a, uint64_t a_bits, uint64_t a_pos,',
            '                             const uint8_t *b, uint64_t b_bits, uint64_t b_pos, uint64_t n, int *out);',
            'nbq_result nbq_popcount_bits(const uint8_t *buf, uint64_t bit_len, uint64_t bit_pos, uint64_t n, uint64_t *out);'
          ]),
          S.ul([
            [S.c('n'), ' may be any length, not just up to 64. ', S.c('n == 0'), ' succeeds and does nothing.'],
            [S.c('nbq_copy_bits'), ': src and dst may be the same buffer; overlapping ranges are handled correctly.'],
            [S.c('nbq_fill_bits'), ': value is 0 or nonzero.'],
            [S.c('nbq_compare_bits'), ': *out is <0, 0 or >0 like memcmp, comparing most-significant bit first.']
          ])
        ], 'indexed'),

        S.section('Cursor API', [
          S.p('Thin wrappers over the indexed API. The structs are public and can live anywhere.'),
          S.code([
            'typedef struct {',
            '    const uint8_t *buf;',
            '    uint64_t bits;      /* valid bits in buf  */',
            '    uint64_t pos;       /* next bit to read   */',
            '} nbq_reader;',
            '',
            'typedef struct {',
            '    uint8_t *buf;',
            '    uint64_t cap;       /* capacity in bits   */',
            '    uint64_t pos;       /* next bit to write  */',
            '    int owns_buf;       /* nonzero if nbq_writer_init_alloc allocated buf */',
            '} nbq_writer;'
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Setup' },
          S.table(FN, [
            fn('nbq_reader_init(r, buf, bit_len)', 'Allocates nothing; buf may be in ROM.'),
            fn('nbq_writer_init(w, buf, bit_cap)', 'Allocates nothing, never grows; a write past bit_cap is NBQ_ERR_RANGE.'),
            fn('nbq_writer_init_alloc(w, initial_bits)', 'Owns a heap buffer and doubles it as needed. The only allocating function. Absent under NBQ_NO_MALLOC.'),
            fn('nbq_writer_free(w)', 'Releases a buffer that init_alloc allocated; a no-op otherwise.')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Position' },
          S.table(FN, [
            fn('nbq_reader_remaining(r)', 'Bits not yet read.'),
            fn('nbq_reader_seek(r, bit_pos)', 'Refuses a position past the end.'),
            fn('nbq_writer_seek(w, bit_pos)', 'A fixed writer refuses a position past its capacity; a growing writer grows.'),
            fn('nbq_reader_align(r, n)', 'Advance to the next multiple of n bits; the skipped bits must be zero or it is NBQ_ERR_MALFORMED.'),
            fn('nbq_writer_align(w, n)', 'Advance to the next multiple of n bits, writing zeros. n of 8 is byte alignment.')
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Sequential reads and writes' },
          S.p(['Each read is the indexed call at ', S.c('r->pos'), ', then advance on success. A growing writer enlarges its buffer when a write would pass ', S.c('cap'), '; a fixed writer returns ', S.c('NBQ_ERR_RANGE'), '.']),
          S.code([
            'nbq_result nbq_read_u64     (nbq_reader *r, unsigned n, uint64_t *out);',
            'nbq_result nbq_read_s64     (nbq_reader *r, unsigned n, int64_t *out);',
            'nbq_result nbq_read_u32     (nbq_reader *r, unsigned n, uint32_t *out);',
            'nbq_result nbq_read_s32     (nbq_reader *r, unsigned n, int32_t *out);',
            'nbq_result nbq_read_parts   (nbq_reader *r, unsigned n, nbq_u64_parts *out);',
            'nbq_result nbq_read_varint  (nbq_reader *r, unsigned base, uint64_t *out);',
            'nbq_result nbq_read_varint_s(nbq_reader *r, unsigned base, int64_t *out);',
            'nbq_result nbq_read_bits    (nbq_reader *r, uint8_t *dst, uint64_t dst_bits, uint64_t dst_pos, uint64_t n);',
            '',
            'static inline nbq_result nbq_read_f32(nbq_reader *r, float  *out);   /* advance 32 */',
            'static inline nbq_result nbq_read_f64(nbq_reader *r, double *out);   /* advance 64 */',
            '',
            'nbq_result nbq_write_u64     (nbq_writer *w, unsigned n, uint64_t value);',
            'nbq_result nbq_write_s64     (nbq_writer *w, unsigned n, int64_t value);',
            'nbq_result nbq_write_u32     (nbq_writer *w, unsigned n, uint32_t value);',
            'nbq_result nbq_write_s32     (nbq_writer *w, unsigned n, int32_t value);',
            'nbq_result nbq_write_parts   (nbq_writer *w, unsigned n, nbq_u64_parts value);',
            'nbq_result nbq_write_varint  (nbq_writer *w, unsigned base, uint64_t value);',
            'nbq_result nbq_write_varint_s(nbq_writer *w, unsigned base, int64_t value);',
            'nbq_result nbq_write_bits    (nbq_writer *w, const uint8_t *src, uint64_t src_bits, uint64_t src_pos, uint64_t n);',
            '',
            'static inline nbq_result nbq_write_f32(nbq_writer *w, float  value);',
            'static inline nbq_result nbq_write_f64(nbq_writer *w, double value);'
          ])
        ], 'cursor'),

        S.section('Not provided', [
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'Insert and delete' },
          S.p('Insert is not in the API because it is a short composition of what is. The example was run against the library.'),
          S.p(['put overwrites in place. To insert a field, open a gap with ', S.c('nbq_copy_bits'), ', which handles the overlap, then put into it. ', S.c('len'), ' is the number of bits in use; ', S.c('cap'), ' is the buffer’s capacity.']),
          S.code([
            'static nbq_result insert_u32(uint8_t *buf, uint64_t cap, uint64_t *len,',
            '                             uint64_t pos, unsigned n, uint32_t value)',
            '{',
            '    nbq_result rc = nbq_copy_bits(buf, cap, pos, buf, cap, pos + n, *len - pos);',
            '    if (rc != NBQ_OK) return rc;              /* no room: nothing moved */',
            '    rc = nbq_put_u32(buf, cap, pos, n, value);',
            '    if (rc != NBQ_OK) return rc;',
            '    *len += n;',
            '    return NBQ_OK;',
            '}',
            '',
            'static nbq_result delete_bits(uint8_t *buf, uint64_t cap, uint64_t *len,',
            '                              uint64_t pos, unsigned n)',
            '{',
            '    nbq_result rc = nbq_copy_bits(buf, cap, pos + n, buf, cap, pos, *len - pos - n);',
            '    if (rc != NBQ_OK) return rc;',
            '    *len -= n;',
            '    return NBQ_OK;',
            '}'
          ]),
          S.p(['Starting from the 24-bit example ', S.c('9D DC 55'), ' (fields 19, 3000, 0x55), inserting the 3-bit value 6 at bit 5 gives ', S.c('9E BB 8A A0'), ', 27 bits, and the fields read back as 19, 6, 3000, 0x55. Deleting those 3 bits restores ', S.c('9D DC 55'), '. An insert that would pass ', S.c('cap'), ' fails with ', S.c('NBQ_ERR_RANGE'), ' and moves nothing. Insertion is linear in the number of bits after ', S.c('pos'), '.']),
          S.bits({ alt: 'the example after inserting 3 bits at bit 5', bytes: [0x9E, 0xBB, 0x8A, 0xA0], fields: [ { name: '19', from: 0, len: 5 }, { name: '6', from: 5, len: 3 }, { name: '3000', from: 8, len: 12 }, { name: '0x55', from: 20, len: 7 } ] }),
        ], 'not-provided'),

        S.section('C++ wrapper', [
          S.p([S.c('#include "nbitq.hpp"'), '; header-only, C++11, includes ', S.c('nbitq.h'), '. Three classes in namespace ', S.c('nbq'), ', every method one call into the C function of the same name with the ', S.c('nbq_read_'), ' / ', S.c('nbq_write_'), ' prefix dropped. Results are ', S.c('nbq_result'), ', as in C. Nothing from the standard library; no exceptions.']),
          S.code([
            'namespace nbq {',
            '',
            'class Reader {                       /* over nbq_reader; copyable */',
            '    Reader();                        /* empty: every read fails until init */',
            '    Reader(const uint8_t *buf, uint64_t bit_len);',
            '    nbq_result init(const uint8_t *buf, uint64_t bit_len);',
            '    const uint8_t *buffer() const;   uint64_t length() const;',
            '    uint64_t pos() const;            uint64_t remaining() const;',
            '    nbq_result seek(uint64_t bit_pos);',
            '    nbq_result align(unsigned n);',
            '    nbq_result u64(unsigned n, uint64_t *out);          /* nbq_read_u64 */',
            '    nbq_result s64(unsigned n, int64_t *out);',
            '    nbq_result u32(unsigned n, uint32_t *out);',
            '    nbq_result s32(unsigned n, int32_t *out);',
            '    nbq_result parts(unsigned n, nbq_u64_parts *out);',
            '    nbq_result varint(unsigned base, uint64_t *out);',
            '    nbq_result varint_s(unsigned base, int64_t *out);',
            '    nbq_result bits(uint8_t *dst, uint64_t dst_bits, uint64_t dst_pos, uint64_t n);',
            '    nbq_result f32(float *out);      nbq_result f64(double *out);',
            '    nbq_reader *handle();            /* the C struct; a const overload too */',
            '};',
            '',
            'class Writer {                       /* over nbq_writer; not copyable */',
            '    Writer();                        /* empty: every write fails until init */',
            '    Writer(uint8_t *buf, uint64_t bit_cap);',
            '    nbq_result init(uint8_t *buf, uint64_t bit_cap);',
            '    uint8_t *buffer();               uint64_t capacity() const;',
            '    uint64_t pos() const;',
            '    nbq_result seek(uint64_t bit_pos);',
            '    nbq_result align(unsigned n);',
            '    nbq_result u64(unsigned n, uint64_t value);         /* nbq_write_u64 */',
            '    nbq_result s64(unsigned n, int64_t value);',
            '    nbq_result u32(unsigned n, uint32_t value);',
            '    nbq_result s32(unsigned n, int32_t value);',
            '    nbq_result parts(unsigned n, nbq_u64_parts value);',
            '    nbq_result varint(unsigned base, uint64_t value);',
            '    nbq_result varint_s(unsigned base, int64_t value);',
            '    nbq_result bits(const uint8_t *src, uint64_t src_bits, uint64_t src_pos, uint64_t n);',
            '    nbq_result f32(float value);     nbq_result f64(double value);',
            '    nbq_writer *handle();',
            '};',
            '',
            'class OwningWriter : public Writer { /* nbq_writer_init_alloc; absent under NBQ_NO_MALLOC */',
            '    OwningWriter();                  /* empty until init */',
            '    explicit OwningWriter(uint64_t initial_bits);',
            '    nbq_result init(uint64_t initial_bits);  /* frees what it owned; 0 = default size */',
            '    ~OwningWriter();                 /* nbq_writer_free */',
            '    /* movable, not copyable */',
            '};',
            '',
            '}'
          ]),
          S.p(['A failed ', S.c('init'), ' leaves the object empty rather than half-set. The indexed functions have no state to wrap and are called directly from C++. A new cursor function in ', S.c('nbitq.h'), ' gets a one-line forwarder here.'])
        ], 'cxx'),

        S.section('Container', [
          S.p([S.c('#include "nbitq_container.h"'), ', compile ', S.c('nbitq_container.c'), '. Optional and separate on purpose.']),
          S.code([
            '#define NBQ_CONTAINER_VERSION 1',
            '#define NBQ_FILE_EXTENSION    ".nbq"',
            '#define NBQ_TYPE_MAX          255u     /* longest type string accepted */',
            '',
            'typedef struct {',
            '    const char    *type;          /* NOT NUL-terminated */',
            '    size_t         type_len;',
            '    const uint8_t *payload;',
            '    uint64_t       payload_bits;',
            '    uint8_t        version;',
            '} nbq_container;',
            '',
            'nbq_result nbq_container_size (size_t type_len, uint64_t payload_bits, uint64_t *out_bytes);',
            'nbq_result nbq_container_write(uint8_t *out, size_t out_cap, const char *type, size_t type_len,',
            '                               const uint8_t *payload, uint64_t payload_bits, size_t *out_len);',
            'nbq_result nbq_container_read (const uint8_t *buf, size_t len, nbq_container *out);',
            'nbq_result nbq_container_read_unchecked(const uint8_t *buf, size_t len, nbq_container *out);'
          ]),
          S.ul([
            ['Layout: ', S.c('"NBQ\\1"'), ', base-8 varint type_len, type bytes, base-8 varint payload_bits, payload zero-padded to a byte, CRC-64 of everything before it, big-endian.'],
            [S.c('nbq_container_read'), ' verifies magic, version, every length, the absence of trailing bytes, and the CRC. On success out aliases buf, which must outlive it; nothing is copied.'],
            [S.c('nbq_container_read_unchecked'), ' skips only the CRC. Every bounds check still runs.'],
            ['type_len may be 0. Longer than ', S.c('NBQ_TYPE_MAX'), ' is ', S.c('NBQ_ERR_PARAM'), '.']
          ]),
          { t: 'h3', a: { class: 'bw_h5 bw_mt_4' }, c: 'CRC-64/XZ' },
          S.code([
            '#define NBQ_CRC64_INIT UINT64_MAX',
            'uint64_t nbq_crc64       (const uint8_t *data, size_t len);',
            'uint64_t nbq_crc64_update(uint64_t crc, const uint8_t *data, size_t len);',
            'uint64_t nbq_crc64_final (uint64_t crc);'
          ]),
          S.p(['ECMA-182 polynomial, reflected, init and final XOR all ones. Verified against ', S.c('CRC-64/XZ("123456789") == 0x995DC9BBDF1939FA'), '. Bitwise, no table.'])
        ], 'container'),

        S.section(null, [
          S.p(['The headers are the reference of record: ', { t: 'a', a: { href: S.REPO + '/blob/main/nbitq.h' }, c: 'nbitq.h' }, ' and ', { t: 'a', a: { href: S.REPO + '/blob/main/nbitq_container.h' }, c: 'nbitq_container.h' }, ' carry the same documentation as comments, next to the declarations.'])
        ])
      ]
    });
  </script>
