<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nbitq - pack and unpack n-bit integers in C</title>
  <meta name="description" content="nbitq packs and unpacks n-bit integers in a bit stream, back to back or at any bit position, and reads them back as native integers. C99, two files, no dependencies.">
  <meta name="author" content="M. A. Chatterjee (github.com/deftio)">
  <script src="https://cdn.jsdelivr.net/npm/bitwrench@2.1.11/dist/bitwrench.umd.min.js"></script>
  <script src="site.js"></script>
  <script data-goatcounter="https://deftio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    var S = nbitqSite;

    S.page('index.html', {
      title: 'Pack and unpack n-bit integers in a bit stream',
      subtitle: 'Put a 5-bit, a 12-bit and a 7-bit value back to back, or at any bit position, and read them back as native integers. For compressed formats, wire protocols, register maps and succinct data structures, where data is laid out in bits rather than bytes.',
      actions: [
        S.linkButton('Getting started', 'getting-started.html', 'light'),
        S.linkButton('How it works', 'how-it-works.html', 'outline-light'),
        S.linkButton('GitHub', S.REPO, 'outline-light')
      ],
      content: [

        S.section(null, [
          S.code([
            '#include "nbitq.h"',
            '',
            'uint8_t buf[64] = {0};',
            '',
            '/* write a 12-bit value starting at bit 13 */',
            'nbq_put_u32(buf, sizeof(buf) * 8, 13, 12, 3000);',
            '',
            '/* read it back */',
            'uint32_t v;',
            'nbq_get_u32(buf, sizeof(buf) * 8, 13, 12, &v);   /* v == 3000 */'
          ])
        ]),

        S.section('What it does', [
          S.p('Bytes are the smallest unit C can address, but a lot of data is not organised in bytes. A compressed file, a wire protocol, a register map or a succinct data structure is specified like this:'),
          { t: 'blockquote', a: { class: 'bw_blockquote bw_mb_3' }, c: 'bits 0–4: symbol index · bits 5–16: jump offset · bits 17–23: flags' },
          S.bits({
            alt: 'three fields packed into three bytes',
            bytes: [0x9D, 0xDC, 0x55],
            fields: [
              { name: 'symbol = 19 (5 bits)', from: 0, len: 5 },
              { name: 'offset = 3000 (12 bits)', from: 5, len: 12 },
              { name: 'flags = 0x55 (7 bits)', from: 17, len: 7 }
            ]
          }),
          S.p(['In C this is normally shift-and-mask code written by hand, and it goes wrong most often where a field straddles a byte boundary, which at arbitrary widths is most of them. The standard library does not cover it: ', S.c('memcpy'), ' moves bytes, struct bit-fields have implementation-defined layout, and C++ ', S.c('std::bitset'), ' cannot return an integer from an offset.']),
          S.p('nbitq is that primitive:'),
          S.code([
            'nbq_reader r;',
            'nbq_reader_init(&r, buf, bit_len);',
            '',
            'uint32_t symbol, offset, flags;',
            'nbq_read_u32(&r, 5,  &symbol);',
            'nbq_read_u32(&r, 12, &offset);',
            'nbq_read_u32(&r, 7,  &flags);'
          ]),
          S.p('There is no alignment requirement and no padding.')
        ]),

        S.section('The library', [
          S.ul([
            ['C99, two files: ', S.c('nbitq.h'), ' and ', S.c('nbitq.c'), '. No dependencies, not even libc for the core; it builds with ', S.c('-ffreestanding'), ' under ', S.c('NBQ_NO_MALLOC'), '.'],
            ['About 4.7 KB of code at ', S.c('-Oz'), ' on Cortex-M; see the table below.'],
            ['Every call is bounds-checked against the length it is given and is all-or-nothing: a call that fails writes nothing and moves no cursor.'],
            ['Optional, in separate files: a ', S.c('.nbq'), ' container with a type string and CRC-64, and ', S.c('nbitq.hpp'), ', a header-only C++ wrapper.'],
            ['BSD-2-Clause.']
          ])
        ], 'library'),

        S.section('Where it fits', [
          bw.makeFeatureGrid({
            columns: 2, centered: false,
            features: [
              { title: 'Formats and codecs', description: 'Compressed containers, packed tries, bit vectors: anything where fields are sized to their content. nbitq addresses the bits; the calling code gives them meaning.' },
              { title: 'Protocols and hardware', description: 'Register dumps, CAN frames, radio packets, telemetry. A spec gives bit offsets and widths; nbitq takes bit offsets and widths.' },
              { title: 'Firmware', description: 'Nothing in the core allocates. The reader accepts a const buffer in ROM. One define removes every hosted header and the core builds freestanding, under 5 KB on a Cortex-M3, with a path that uses no 64-bit arithmetic.' },
              { title: 'Portable output', description: 'The bit order is fixed and documented, and varints are canonical. Two programs on two machines produce the same bytes for the same input.' }
            ]
          })
        ]),

        S.section('Where it does not fit', [
          S.ul([
            ['Fields that are whole bytes: ', S.c('memcpy'), ' is enough.'],
            ['A parser generated from a format description: ', { t: 'a', a: { href: 'https://kaitai.io/' }, c: 'Kaitai Struct' }, ' does that.'],
            ['Bulk integer arrays at high throughput: SIMD bit-packing libraries such as ', { t: 'a', a: { href: 'https://github.com/lemire/simdcomp' }, c: 'simdcomp' }, ' are much faster. nbitq is bit-at-a-time by design.'],
            ['Python: ', { t: 'a', a: { href: 'https://bitstring.readthedocs.io/' }, c: 'bitstring' }, ' is more capable there.']
          ])
        ]),

        S.section('Functions', [
          S.table(['Operation', 'nbitq'], [
            { Operation: 'A field at a known position', nbitq: 'nbq_get_u32 / nbq_put_u32, with 64-bit and signed variants' },
            { Operation: 'A sequence of fields', nbitq: 'nbq_reader / nbq_writer cursors, with seek and align' },
            { Operation: 'A small number in few bits', nbitq: 'varints at any group width from 2 to 64 bits; base 8 is LEB128 exactly' },
            { Operation: 'A span of bits moved elsewhere', nbitq: 'nbq_copy_bits from any offset to any offset, overlap-safe' },
            { Operation: 'Compare, fill, count', nbitq: 'nbq_compare_bits, nbq_fill_bits, nbq_popcount_bits' },
            { Operation: 'A float or double', nbitq: 'nbq_get_f32 / nbq_put_f32, nbq_get_f64 / nbq_put_f64: IEEE-754 bit patterns, header-only' },
            { Operation: 'From C++', nbitq: 'nbitq.hpp: nbq::Reader, nbq::Writer, nbq::OwningWriter; each method one call into the C library' },
            { Operation: '64-bit values on a 32-bit CPU', nbitq: 'nbq_get_parts / nbq_put_parts, 32-bit arithmetic only' },
            { Operation: 'A bit run stored in a file', nbitq: 'the optional .nbq container: length, type string, CRC-64' }
          ])
        ]),

        S.section('Fixed conventions', [
          bw.makeFeatureGrid({
            columns: 2, centered: false,
            features: [
              { title: 'Bit 0 is the MSB of byte 0', description: 'Fields are written most-significant bit first. This does not change.' },
              { title: 'Every operation is all-or-nothing', description: 'On failure nothing is written and no cursor moves, so a failed read can be retried.' },
              { title: 'Bad input is refused, not approximated', description: 'An out-of-range width or position, a varint too wide for 64 bits, or an overlong encoding is an error.' },
              { title: 'Varints are canonical', description: 'One value has exactly one encoding.' }
            ]
          })
        ]),

        S.section('Code size', [
          S.p(['Freestanding, with ', S.c('NBQ_NO_MALLOC'), ', no libc, ', S.c('-Oz'), '. Reproduce with ', S.c('make targets'), '.']),
          S.table([{ key: 'target', label: 'Target' }, { key: 'text', label: '.text (bytes)' }], [
            { target: 'Cortex-M3 / M4 / M7 (Thumb-2)', text: '4,793' },
            { target: 'Cortex-M0 (Thumb-1)', text: '5,025' },
            { target: 'ARM v7-A', text: '7,249' },
            { target: 'AArch64', text: '4,389' },
            { target: 'x86-64', text: '4,545' }
          ]),
          S.p('The tests cover every width from 1 to 64, every varint base from 2 to 64, every start offset within a byte and truncation at every bit position, under AddressSanitizer and UndefinedBehaviorSanitizer, plus a property-checking fuzz harness.')
        ]),

        S.next([['Getting started', 'getting-started.html'], ['How it works', 'how-it-works.html'], ['API reference', 'api.html']])
      ]
    });
  </script>
</body>
</html>
