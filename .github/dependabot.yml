# Keeps the GitHub Actions used by ci.yml current, and nothing else.
# The workflow pins actions by major tag (actions/checkout@v4), so a pull
# request appears only when a new major version exists: at most one PR,
# checked once a month, with every action update grouped into it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
